# Nombre de la aplicación
spring.application.name=autobuses-api

# Configuración de base de datos usando las variables que te da Railway
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de tiempo de espera para conexión a BD
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# Configuración para reintento de conexión
spring.datasource.tomcat.max-wait=20000
spring.datasource.tomcat.max-active=50
spring.datasource.tomcat.max-idle=20
spring.datasource.tomcat.min-idle=15

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Evitar problemas de inicialización de la BD
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Tiempo de espera para que la BD esté lista
spring.boot.admin.client.instance.metadata.startup=30000

# Logging detallado para debug
logging.level.org.springframework=INFO
logging.level.com.omnibus.backend=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.zaxxer.hikari=DEBUG

# Puerto para Railway (usa la variable PORT que ya está seteada en el entorno)
server.port=${PORT:8080}
server.address=0.0.0.0

# Actuator para health checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.db.enabled=true