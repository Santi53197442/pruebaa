# Nombre de la aplicación
spring.application.name=autobuses-api

# Configuración de base de datos - Usar la URL directamente
spring.datasource.url=${DATABASE_URL}

# Configuración de Hikari más tolerante a fallos
spring.datasource.hikari.connection-timeout=120000
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.connection-test-query=SELECT 1

# Configuración de JPA/Hibernate más tolerante
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.open-in-view=false

# Configuración para mejorar inicio
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Reducir el nivel de logging para mejorar rendimiento
logging.level.root=WARN
logging.level.com.omnibus.backend=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=WARN

# Permitir reintentos de conexión
spring.datasource.hikari.initialization-fail-timeout=60000

# Puerto para Railway
server.port=${PORT:8080}


# Actuator para health checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always