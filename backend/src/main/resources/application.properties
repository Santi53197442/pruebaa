# Nombre de la aplicación
spring.application.name=autobuses-api

# Configuración de base de datos usando las variables que te da Railway
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging detallado para debug
logging.level.org.springframework=INFO
logging.level.com.omnibus.backend=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Puerto para Railway (usa la variable PORT que ya está seteada en el entorno)
server.port=${PORT:8080}
server.address=0.0.0.0
